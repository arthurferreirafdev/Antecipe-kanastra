server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # Mesmo limite que o front aplica antes do envio (30 MB).
    client_max_body_size 30m;

    # A API não tem CORS: o navegador fala só com esta origem e o nginx repassa ao backend.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O front desiste após 120 s (TEMPO_LIMITE_ANALISE_MS).
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # Arquivos com hash no nome podem ficar em cache indefinidamente.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rotas do Angular (/analise, /nova-antecipacao…) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
