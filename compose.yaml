# Sobe a API (.NET, pasta api/) e o front (Angular + nginx, pasta web/) juntos: docker compose up --build
# Front: http://localhost:4200 · API/Swagger: http://localhost:8080/swagger
services:
  api:
    image: antecipe-api
    build:
      context: ./api
    environment:
      # Horário local nos logs; as regras usam a DATA_AQUISICAO de cada nota, não a data do servidor.
      TZ: America/Sao_Paulo
      # Opcionais: trocam regras e bases sem rebuild (monte os arquivos com um volume).
      # Padrão: arquivos de /app/Dados, copiados de api/Antecipe.Api/Dados no build.
      # ANTECIPE_CONFIG: /app/Dados/validators.json
      # ANTECIPE_ESTOQUE: /app/Dados/estoque_antecipe.csv
      # ANTECIPE_SITUACOES: /app/Dados/situacoes_cadastrais_dev.json
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # A imagem aspnet não traz curl; a checagem só confirma que a porta aceita conexões.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  web:
    image: antecipe-web
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4200}:80"
    restart: unless-stopped
