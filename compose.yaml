# Sobe backend (.NET) e frontend (Angular + nginx) juntos: docker compose up --build
# Front: http://localhost:4200 · API/Swagger: http://localhost:8080/swagger
services:
  api:
    image: antecipe-api
    build:
      context: .
      dockerfile: antecipe-kanastra-back/antecipe-kanastra-back/Dockerfile
    environment:
      # A data da análise usa DateTime.Today: sem isso o container seguiria o UTC.
      TZ: America/Sao_Paulo
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # A imagem aspnet não traz curl; a checagem só confirma que a porta aceita conexões.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  web:
    image: antecipe-web
    build:
      context: ./antecipe-kanastra-front
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4200}:80"
    restart: unless-stopped
